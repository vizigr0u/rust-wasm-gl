[package]
name = "backend"
version = "0.1.0"
authors = ["Vladimir Nachbaur <vizigr0u@gmail.com>"]
edition = "2021"
description = "WebGL2 game/experiment"
repository = "https://github.com/vizigr0u/rust-wasm-gl"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bitcode = "0.6"
bytemuck = { version = "1.15", features = ["derive"] }
cfg-if = "1.0.0"
console_error_panic_hook = { version = "0.1" }
console_log = "1.0"
egui = { version = "0.27", features = ['bytemuck', 'log', 'mint', "serde"] }
egui-wgpu = { version = "0.27.2", features = ["winit"] }
egui-winit = { version = "0.27.2", default-features = false, features = [
    "links",
    "serde",
] }
egui_plot = "0.27"
fastrand = { version = "2.0", default-features = false, features = ["js"] }
getrandom = { version = "0.2", features = ["js"] }
glam = "0.27"
gloo = { version = "0.11.0" }
glow = { version = "0.13", optional = true }
instant = { version = "0.1.12", optional = true } # wgpu depends on parking_lot, which depends on instant but without the wasm-bindgen feature
itertools = "0.12"
js-sys = "0.3"
log = "0.4"
tracing = "0.1"
tracing-wasm = "0.2"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wasm_thread = { version = "0.3.0", features = ["es_modules"] }
winit = "0.29.15"
wgpu = { version = "0.19.3", features = ["webgpu"], optional = true }

[dependencies.web-sys]
version = "0.3"
features = [
    'console',
    'Document',
    'Element',
    'HtmlCanvasElement',
    'WebGlBuffer',
    'WebGlVertexArrayObject',
    'WebGl2RenderingContext',
    'WebGlUniformLocation',
    'WebGlProgram',
    'WebGlShader',
    'MessageEvent',
    'Window',
    'ImageBitmap',
    'HtmlImageElement',
    'Headers',
    'Request',
    'RequestInit',
    'RequestMode',
    'Response',
    'Performance',
    'MouseEvent',
    'WheelEvent',
    'KeyboardEvent',
    'DedicatedWorkerGlobalScope',
]


[profile.dev]
opt-level = 0           # do not optimize for debug
debug = true            # print debug info
debug-assertions = true # enable debug assertions
overflow-checks = true  # check for overflows

[profile.release]
opt-level = "s"     # optimize for small code size.
lto = true          # Enable link time optimizations
debug = false       # Strip debug information
codegen-units = 1   # More aggressive optimizations at the cost of compilation time
incremental = false # Disable incremental compilation

[features]
default = ["wgpu", "glow"]
wgpu = ["dep:wgpu", "instant/wasm-bindgen"]
glow = ["dep:glow"]

# wgpu = ["dep:wgpu"]
