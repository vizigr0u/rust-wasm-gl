[package]
name = "backend"
version = "0.1.0"
authors = ["Vladimir Nachbaur <vizigr0u@gmail.com>"]
edition = "2021"
description = "WebGPU voxel game/experiment"
repository = "https://github.com/vizigr0u/rust-wasm-gl"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
voxel-core = { path = "../voxel-core" }
itertools = "0.15"
cfg-if = "1.0.0"
js-sys = "0.3.69"
wasm-bindgen = { version = "0.2.92", features = ["enable-interning"] }
glam = "0.34"
getrandom = { version = "0.2", features = ["js"] }

# The `console_error_panic_hook` crate provides better debugging of panics by
# logging them with `console.error`. This is great for development, but requires
# all the `std::fmt` and `std::panicking` infrastructure, so isn't great for
# code size when deploying.
console_error_panic_hook = { version = "0.1.7", optional = true }

wgpu = { version = "30.0", default-features = false, features = ["webgpu", "wgsl"] }
wasm-bindgen-futures = "0.4.42"
gloo = { version = "0.13", features = ['gloo-events'] }
log = "0.4.21"
console_log = { version = "1.0.0", optional = true }
bytemuck = "1.15.0"
fastrand = { version = "2.0.1", default-features = false, features = ["js"] }

[dependencies.web-sys]
version = "0.3.69"
features = [
    'console',
    'Document',
    'Element',
    'DomRect',
    'HtmlCanvasElement',
    'Window',
    'Location',
    'ImageBitmap',
    'HtmlImageElement',
    'Headers',
    'Request',
    'RequestInit',
    'RequestMode',
    'Response',
    'Performance',
    'MouseEvent',
    'WheelEvent',
    'KeyboardEvent',
    'Worker',
    'ErrorEvent',
]

[features]
default = ["console_error_panic_hook", "console_log"]
# Deterministic scene driver for Playwright (window.__RWG_TEST__). Not for release builds.
test-hooks = []
