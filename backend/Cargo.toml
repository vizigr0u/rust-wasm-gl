[package]
name = "backend"
version = "0.1.0"
authors = ["Vladimir Nachbaur <vizigr0u@gmail.com>"]
edition = "2018"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm_thread = { version = "0.3.0", features = ["es_modules"] }

# wgpu depends on parking_lot, which depends on instant but without the wasm-bindgen featurecfg-if = "1.0.0"
winit = "0.29.15"
wgpu = { version = "0.19.3", features = ["webgpu"], optional = true }
log = "0.4"
console_error_panic_hook = { version = "0.1", optional = true }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4.42"
console_log = "1.0.0"
instant = { version = "0.1.12", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3.42"

[dependencies.web-sys]
features = [
    'console',
    'Document',
    'Element',
    'HtmlCanvasElement',
    'MessageEvent',
    'Window',
]
version = "0.3"

[profile.dev]
opt-level = 0           # do not optimize for debug
debug = true            # print debug info
debug-assertions = true # enable debug assertions
overflow-checks = true  # check for overflows
incremental = true

[profile.release]
opt-level = "s"     # optimize for small code size.
lto = true          # Enable link time optimizations
debug = false       # Strip debug information
codegen-units = 1   # More aggressive optimizations at the cost of compilation time
incremental = false # Disable incremental compilation

[features]
default = ["wgpu"]
wgpu = ["dep:console_error_panic_hook", "dep:wgpu", "instant/wasm-bindgen"]

# wgpu = ["dep:wgpu"]
